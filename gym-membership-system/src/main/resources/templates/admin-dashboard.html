<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/admin/dashboard}">Gym Membership System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/admin/dashboard}">Admin Dashboard</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white me-3">
                    Admin: <span th:text="${userName}" class="ms-1"></span>
                </div>
                <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>All Requests</span>
                <span class="badge bg-secondary" th:text="${#lists.size(requests)}"></span>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(requests)}">
                    <p>No requests found.</p>
                </div>
                <div th:unless="${#lists.isEmpty(requests)}">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Request ID</th>
                                <th>User</th>
                                <th>Service</th>
                                <th>Charge (₹)</th>
                                <th>Status</th>
                                <th>Created Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="request : ${requests}">
                                <td th:text="${request.referenceId}"></td>
                                <td th:text="${request.nameSnapshot}"></td>
                                <td th:text="${request.serviceNameSnapshot}"></td>
                                <td th:text="${request.charge}"></td>
                                <td>
                                    <span th:switch="${request.status.name()}">
                                        <span th:case="'SUBMITTED'" class="badge bg-warning text-dark">SUBMITTED</span>
                                        <span th:case="'APPROVED_ASSIGNED'" class="badge bg-info">APPROVED/ASSIGNED</span>
                                        <span th:case="'IN_PROGRESS'" class="badge bg-primary">IN PROGRESS</span>
                                        <span th:case="'COMPLETED'" class="badge bg-success">COMPLETED</span>
                                        <span th:case="'CANCELLED'" class="badge bg-danger">CANCELLED</span>
                                    </span>
                                </td>
                                <td th:text="${#temporals.format(request.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
                                <td>
                                    <a th:href="@{/requests/{id}(id=${request.referenceId})}" class="btn btn-sm btn-outline-info">View</a>
                                    
                                    <div style="display:inline-block;" th:switch="${request.status.name()}">
                                        <form th:case="'SUBMITTED'" th:action="@{/admin/requests/{id}/advance(id=${request.referenceId})}" method="post" style="display:inline">
                                            <button class="btn btn-sm btn-success">Approve</button>
                                        </form>
                                        <form th:case="'APPROVED_ASSIGNED'" th:action="@{/admin/requests/{id}/advance(id=${request.referenceId})}" method="post" style="display:inline">
                                            <button class="btn btn-sm btn-primary">In Progress</button>
                                        </form>
                                        <form th:case="'IN_PROGRESS'" th:action="@{/admin/requests/{id}/advance(id=${request.referenceId})}" method="post" style="display:inline">
                                            <button class="btn btn-sm btn-info">Complete</button>
                                        </form>
                                        <span th:case="'COMPLETED'" class="badge bg-success">Done</span>
                                        <span th:case="'CANCELLED'" class="badge bg-danger">Cancelled</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
