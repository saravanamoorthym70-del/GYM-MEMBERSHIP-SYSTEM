<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice - Gym Membership System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <div class="error-container">
        <div class="error-card card p-4 p-md-5">
            <div class="mx-auto mb-3" style="width: 72px; height: 72px; background: #fff7ed; border-radius: 20px; display: flex; align-items: center; justify-content: center; border: 2px solid #fed7aa;">
                <i class="bi bi-exclamation-octagon-fill text-warning fs-1"></i>
            </div>
            
            <h3 class="fw-bold mb-2 text-dark">Action Rejected / Notice</h3>
            
            <div class="p-3 rounded-4 mb-4" style="background: #fef2f2; border: 1.5px solid #fecaca;">
                <p th:if="${errorMessage}" th:text="${errorMessage}" class="text-danger fw-semibold mb-0 fs-6">Validation or authorization error occurred.</p>
                <p th:unless="${errorMessage}" class="text-danger fw-semibold mb-0 fs-6">An unexpected error occurred while processing your request.</p>
            </div>
            
            <div class="d-flex justify-content-center gap-2">
                <button onclick="history.back()" class="btn btn-primary px-4">
                    <i class="bi bi-arrow-left me-1"></i> Go Back
                </button>
                <a th:href="@{/dashboard}" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-house me-1"></i> Home
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
