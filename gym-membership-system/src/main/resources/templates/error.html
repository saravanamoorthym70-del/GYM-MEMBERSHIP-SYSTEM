<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="error-container">
        <div class="error-card card p-5">
            <div class="mb-4" style="font-size: 3rem;">⚠️</div>
            <h2 class="mb-3">Error Occurred</h2>
            <p th:if="${errorMessage}" th:text="${errorMessage}" class="text-danger mb-4">An unexpected error occurred.</p>
            <p th:unless="${errorMessage}" class="text-danger mb-4">An unexpected error occurred.</p>
            
            <div>
                <a th:href="@{/login}" class="btn btn-primary me-2">Back to Home</a>
                <button onclick="history.back()" class="btn btn-outline-secondary">Go Back</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
