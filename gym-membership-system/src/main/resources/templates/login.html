<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Membership System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="login-container">
        <div class="login-card card p-4 text-center">
            <h2 class="mb-2 font-weight-bold">GYM MEMBERSHIP SYSTEM</h2>
            <h5 class="text-muted mb-4">Software Engineering SAT II Assessment</h5>
            
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <p class="mb-3 fw-bold">Select User to Login</p>

            <div class="d-grid gap-3">
                <form th:action="@{/login}" method="post">
                    <input type="hidden" name="userId" value="U001">
                    <button type="submit" class="btn btn-primary w-100">Arun Kumar (User)</button>
                </form>

                <form th:action="@{/login}" method="post">
                    <input type="hidden" name="userId" value="U002">
                    <button type="submit" class="btn btn-primary w-100">Bala Kumar (User)</button>
                </form>

                <form th:action="@{/login}" method="post">
                    <input type="hidden" name="userId" value="A001">
                    <button type="submit" class="btn btn-danger w-100">Administrator</button>
                </form>
            </div>

            <div class="mt-4 text-muted small">
                Sri Eshwar College of Engineering
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
