<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">Gym Membership System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/membership/create}">Create Membership</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/requests}">My Requests</a></li>
                </ul>
                <div class="d-flex align-items-center text-white me-3">
                    Welcome, <span th:text="${userName}" class="ms-1"></span>
                </div>
                <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="card mb-4">
            <div class="card-header">My Requests</div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(requests)}">
                    <p>No requests found.</p>
                </div>
                <div th:unless="${#lists.isEmpty(requests)}">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Request ID</th>
                                <th>Service</th>
                                <th>Charge (₹)</th>
                                <th>Status</th>
                                <th>Created Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="request : ${requests}">
                                <td th:text="${request.referenceId}"></td>
                                <td th:text="${request.serviceName}"></td>
                                <td th:text="${request.charge}"></td>
                                <td>
                                    <span th:switch="${request.status.name()}">
                                        <span th:case="'SUBMITTED'" class="badge bg-warning text-dark">SUBMITTED</span>
                                        <span th:case="'APPROVED_ASSIGNED'" class="badge bg-info">APPROVED/ASSIGNED</span>
                                        <span th:case="'IN_PROGRESS'" class="badge bg-primary">IN PROGRESS</span>
                                        <span th:case="'COMPLETED'" class="badge bg-success">COMPLETED</span>
                                        <span th:case="'CANCELLED'" class="badge bg-danger">CANCELLED</span>
                                    </span>
                                </td>
                                <td th:text="${#temporals.format(request.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
                                <td>
                                    <a th:href="@{/requests/{id}(id=${request.referenceId})}" class="btn btn-sm btn-outline-primary">View Details</a>
                                    
                                    <form th:if="${request.status.name() == 'SUBMITTED'}" th:action="@{/requests/{id}/cancel(id=${request.referenceId})}" method="post" style="display:inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to cancel this request?')">Cancel</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="mt-3">
                    <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
