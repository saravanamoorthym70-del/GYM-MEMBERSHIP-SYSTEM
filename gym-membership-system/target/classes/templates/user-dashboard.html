<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">Gym Membership System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/membership/create}">Create Membership</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/requests}">My Requests</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white me-3">
                    Welcome, <span th:text="${userName}" class="ms-1"></span>
                </div>
                <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card mb-4">
            <div class="card-body">
                <h4 class="card-title">Welcome, <span th:text="${userName}"></span>!</h4>
                <p class="card-text">Manage your gym memberships and track your requests from your dashboard.</p>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">Available Memberships</div>
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Service Name</th>
                            <th>Total Capacity</th>
                            <th>Available</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="resource : ${resources}">
                            <td th:text="${resource.id}"></td>
                            <td th:text="${resource.serviceName}"></td>
                            <td th:text="${resource.capacity}"></td>
                            <td th:text="${resource.availableCapacity}"></td>
                            <td>
                                <span class="badge" th:classappend="${resource.status == 'ACTIVE'} ? 'bg-success' : 'bg-danger'" th:text="${resource.status}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row mb-5">
            <div class="col">
                <a th:href="@{/membership/create}" class="btn btn-primary">Create New Membership</a>
                <a th:href="@{/requests}" class="btn btn-outline-primary ms-2">View My Requests</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
