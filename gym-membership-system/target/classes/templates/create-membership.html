<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Membership</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">Gym Membership System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/membership/create}">Create Membership</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/requests}">My Requests</a></li>
                </ul>
                <div class="d-flex align-items-center text-white me-3">
                    Welcome, <span th:text="${userName}" class="ms-1"></span>
                </div>
                <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="row">
            <div class="col-md-7">
                <div class="card">
                    <div class="card-header">Create Membership Request</div>
                    <div class="card-body">
                        <form method="POST" th:action="@{/membership/submit}" th:object="${form}">
                            <div class="mb-3">
                                <label class="form-label">Name:</label>
                                <input type="text" class="form-control" th:field="*{name}" required placeholder="Enter full name">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone:</label>
                                <input type="text" class="form-control" th:field="*{phone}" required placeholder="10-digit phone number" maxlength="10">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description:</label>
                                <textarea class="form-control" th:field="*{description}" required placeholder="E.g., Annual gym membership" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Select Service:</label>
                                <select class="form-select" th:field="*{resourceId}" required id="resourceSelect">
                                    <option value="">-- Select Service --</option>
                                    <option th:each="resource : ${allResources}" 
                                            th:value="${resource.id}" 
                                            th:text="${resource.serviceName + ' (Available: ' + resource.availableCapacity + ')'}" 
                                            th:attr="data-capacity=${resource.capacity},data-available=${resource.availableCapacity},data-status=${resource.status}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Amount (₹):</label>
                                <input type="number" class="form-control" th:field="*{amount}" id="amountInput" placeholder="Enter amount" step="0.01" min="0" onchange="calculateCharge()" onkeyup="calculateCharge()">
                            </div>
                            <div class="mt-2">
                                <strong>Calculated Charge: </strong>
                                <span id="chargeDisplay" class="badge bg-info fs-6">₹0</span>
                            </div>
                            
                            <button type="submit" class="btn btn-success btn-lg mt-3">Submit Membership Request</button>
                            <a th:href="@{/dashboard}" class="btn btn-outline-secondary mt-3 ms-2">Back to Dashboard</a>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card">
                    <div class="card-header">Available Services</div>
                    <div class="card-body p-0">
                        <table class="table table-sm table-striped mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Service</th>
                                    <th>Capacity</th>
                                    <th>Available</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="resource : ${allResources}">
                                    <td th:text="${resource.id}"></td>
                                    <td th:text="${resource.serviceName}"></td>
                                    <td th:text="${resource.capacity}"></td>
                                    <td th:text="${resource.availableCapacity}"></td>
                                    <td>
                                        <span class="badge" th:classappend="${resource.status == 'ACTIVE'} ? 'bg-success' : 'bg-danger'" th:text="${resource.status}"></span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function calculateCharge() {
        var amountInput = document.getElementById('amountInput');
        var chargeDisplay = document.getElementById('chargeDisplay');
        var amount = parseFloat(amountInput.value);
        if (isNaN(amount) || amount <= 0) {
            chargeDisplay.textContent = '₹0';
        } else if (amount < 1000) {
            chargeDisplay.textContent = '₹50';
        } else {
            chargeDisplay.textContent = '₹0';
        }
    }
    </script>
</body>
</html>
